[package]
name = "localtt-server"
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description.workspace = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
directories = "6.0.0"
fs2 = "0.4.3"
localtt-adapter = { path = "../localtt-adapter" }
localtt-core = { path = "../localtt-core" }
localtt-engine = { path = "../localtt-engine" }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm"] }
thiserror.workspace = true
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { workspace = true }

[lints]
workspace = true

[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:crossterm"]

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "localtt"
path = "src/bin/localtt.rs"
required-features = ["tui"]
