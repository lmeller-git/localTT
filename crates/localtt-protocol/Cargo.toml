[package]
name = "localtt-protocol"
rust-version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Transport DTOs and the typed route table shared by local-tt clients."

[package.metadata.docs.rs]
all-features = true

[features]
# Conversions from the engine's types into the DTOs. Off by default so clients
# that only consume the DTOs (the browser) do not link the engine.
engine = ["dep:localtt-engine"]

[dependencies]
localtt-core = { path = "../localtt-core" }
localtt-engine = { path = "../localtt-engine", optional = true }
serde.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
uuid.workspace = true
